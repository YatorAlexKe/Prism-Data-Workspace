name: Prism CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart pandas \
                      openpyxl xlsxwriter requests python-dotenv \
                      Pillow pymysql cryptography flake8

      - name: Run automated tests
        run: |
          cd backend
          python tests/test_prism.py

      - name: Run linter
        run: |
          cd backend
          flake8 . --max-line-length=120 --exclude=venv,__pycache__ \
                   --ignore=E501,W503,E302,E303,E305,W293,W292,W291