name: Prism CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart pandas \
                      openpyxl xlsxwriter requests python-dotenv \
                      Pillow pymysql cryptography flake8

      - name: Run automated tests
        run: |
          cd backend
          python tests/test_prism.py

      - name: Run linter
        run: |
          cd backend
          flake8 . --max-line-length=150 --exclude=venv,__pycache__ \
                   --select=E9,F7,F8 \
                   --ignore=F401,F841

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build