<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism — AI Data Workspace</title>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>

  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages/dashboard.css">
  <link rel="stylesheet" href="/static/css/pages/ingest.css">
  <link rel="stylesheet" href="/static/css/pages/query.css">
  <link rel="stylesheet" href="/static/css/pages/profile.css">
  <link rel="stylesheet" href="/static/css/pages/projects.css">
  <link rel="stylesheet" href="/static/css/pages/history.css">
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">P</div>
      <div class="logo-text">Pri<span>sm</span></div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>
      <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </div>
      <div class="nav-item" onclick="showPage('ingest')" id="nav-ingest">
        <span class="nav-icon">⬆</span> Import Data
      </div>
      <div class="nav-item" onclick="showPage('query')" id="nav-query">
        <span class="nav-icon">⚡</span> Query
      </div>
      <div class="nav-item" onclick="showPage('profile')" id="nav-profile">
        <span class="nav-icon">◉</span> Profile
      </div>

      <div class="nav-section-label">Organize</div>
      <div class="nav-item" onclick="showPage('projects')" id="nav-projects">
        <span class="nav-icon">▣</span> Projects
      </div>
      <div class="nav-item" onclick="showPage('history')" id="nav-history">
        <span class="nav-icon">◷</span> History
        <span class="nav-badge" id="history-count">0</span>
      </div>
    </nav>

    <div class="sidebar-datasets">
      <div
        style="padding:8px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-family:var(--mono)">
        Datasets</div>
      <div id="sidebar-datasets-list">
        <div style="padding:8px 16px;font-size:11px;color:var(--border2);font-family:var(--mono)">No datasets yet</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="spacer"></div>
      <div class="llm-config">
        <span style="font-size:11px;color:var(--muted);font-family:var(--mono)">LLM:</span>
        <select title="llm-selection" id="llm-provider" onchange="onProviderChange()">
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
        </select>
        <input type="text" id="llm-model" placeholder="llama3.2" style="width:100px">
        <input type="password" id="llm-apikey" placeholder="API key" style="width:110px;display:none">
      </div>
    </div>

    <!-- Page containers — fragments are injected on first navigation -->
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-ingest"></div>
    <div class="page" id="page-query"></div>
    <div class="page" id="page-profile"></div>
    <div class="page" id="page-projects"></div>
    <div class="page" id="page-history"></div>
  </div>

  <!-- SAVE QUERY MODAL -->
  <div class="modal-overlay" id="save-modal">
    <div class="modal">
      <div class="modal-title">Save Query</div>
      <div class="form-field">
        <label class="form-label">Query Name</label>
        <input type="text" id="save-name" class="form-input" placeholder="e.g. Top 10 by Revenue">
      </div>
      <div class="form-field">
        <label class="form-label">Project (optional)</label>
        <select id="save-project" class="form-input" title="save-project" style="width:100%">
          <option value="">No project</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeSaveModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveQuery()">Save</button>
      </div>
    </div>
  </div>

  <!-- NEW PROJECT MODAL -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <div class="modal-title">New Project</div>
      <div class="form-field">
        <label class="form-label">Project Name</label>
        <input type="text" id="project-name" class="form-input" placeholder="e.g. Sales Analysis">
      </div>
      <div class="form-field">
        <label class="form-label">Description</label>
        <input type="text" id="project-desc" class="form-input" placeholder="Optional description">
      </div>
      <div class="form-field">
        <label class="form-label">Color</label>
        <div class="color-picker" id="color-picker"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeProjectModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createProject()">Create</button>
      </div>
    </div>
  </div>

  <!-- EDIT DATASET MODAL -->
  <div class="modal-overlay" id="edit-dataset-modal">
    <div class="modal modal-wide">
      <div class="modal-title" id="edit-dataset-title">Edit Dataset</div>
      <div class="edit-row-actions" id="edit-dataset-meta"></div>
      <div class="edit-table-wrap" id="edit-dataset-table">
        <div class="empty-state" style="min-height:120px"><div class="empty-icon">⟳</div><div class="empty-text">Loading...</div></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeEditDatasetModal()">Cancel</button>
        <button class="btn btn-primary" id="edit-dataset-save-btn" onclick="saveEditedDataset()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Load order matters: config → state → utilities → navigation → page modules → init -->
  <script src="/static/js/config.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/llm.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/ingest.js"></script>
  <script src="/static/js/pages/query.js"></script>
  <script src="/static/js/pages/profile.js"></script>
  <script src="/static/js/pages/projects.js"></script>
  <script src="/static/js/pages/history.js"></script>
  <script>
    // Boot: load dashboard fragment + populate sidebar history badge.
    showPage('dashboard');
    loadHistoryCount();
  </script>
</body>

</html>
